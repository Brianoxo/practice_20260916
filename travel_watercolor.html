<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端水色 - 智慧旅遊行程選購與會員管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            watercolor: { paper: '#fcfbf9', blue: '#e0edee', lavender: '#eae2f8', gold: '#f3e5ab', earth: '#8b7d6b' }
          },
          fontFamily: { serif: ['"Noto Serif TC"', 'serif'], handwriting: ['"Zhi Mang Xing"', 'cursive'] }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #fcfbf9;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(224, 237, 238, 0.4) 0%, transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(234, 226, 248, 0.35) 0%, transparent 45%);
      background-attachment: fixed;
      font-family: 'Noto Serif TC', serif;
    }
    .watercolor-card {
      backdrop-filter: blur(8px);
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(214, 204, 194, 0.4);
      border-radius: 1.5rem;
      transition: all 0.4s ease;
    }
    .watercolor-card:hover {
      box-shadow: 0 12px 25px -5px rgba(180, 160, 140, 0.2);
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #d4c5b9; border-radius: 4px; }
  </style>
</head>
<body class="text-stone-700 min-h-screen flex flex-col selection:bg-amber-100">

  <!-- 頂部導覽列 -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-white/70 border-b border-stone-200/60 px-6 py-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-stone-300 to-amber-100 flex items-center justify-center">
          <span class="text-xl">🎨</span>
        </div>
        <div>
          <h1 class="text-xl font-semibold text-stone-800">雲端水色</h1>
          <p class="text-xs text-stone-500 font-serif">智慧旅遊與會員系統</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <!-- 會員身分切換與顯示 -->
        <div id="user-badge" class="hidden items-center space-x-2 bg-indigo-50 px-3 py-1.5 rounded-full border border-indigo-200 text-xs text-indigo-900">
          <span>👤</span>
          <span id="current-user-info">未綁定身分</span>
        </div>
        <button onclick="openMemberModal()" class="px-3.5 py-1.5 rounded-full text-xs font-medium bg-stone-100 hover:bg-stone-200 border border-stone-300 transition shadow-sm">
          ✨ 會員註冊
        </button>
        <button id="toggle-guide-mode" onclick="toggleGuideMode()" class="px-4 py-2 rounded-full text-xs font-medium bg-stone-100 hover:bg-stone-200 border border-stone-300 transition shadow-sm">
          🖌️ 切換為嚮導後台
        </button>
      </div>
    </div>
  </header>

  <!-- 嚮導/管理員控制台 (對應 add_menu, delete_menu, update_order_status, 讀取 orders/members) -->
  <section id="guide-panel" class="max-w-7xl mx-auto px-6 w-full hidden my-6 space-y-6">
    <div class="watercolor-card p-6 md:p-8 bg-gradient-to-br from-amber-50/40 via-white/80 to-indigo-50/30">
      <h2 class="text-lg font-semibold text-stone-800 mb-4">✨ 嚮導畫布：新增寫生行程 (add_menu)</h2>
      <form id="add-tour-form" onsubmit="handleAddTour(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <input type="text" name="title" required placeholder="行程名稱" class="px-3 py-2 text-sm rounded-lg bg-white/80 border border-stone-300 focus:outline-none focus:ring-2 focus:ring-amber-200">
        <input type="text" name="category" placeholder="分類 (例: 自然山林)" class="px-3 py-2 text-sm rounded-lg bg-white/80 border border-stone-300 focus:outline-none focus:ring-2 focus:ring-amber-200">
        <input type="number" name="price" required placeholder="售價 NT$" class="px-3 py-2 text-sm rounded-lg bg-white/80 border border-stone-300 focus:outline-none focus:ring-2 focus:ring-amber-200">
        <input type="number" name="duration_days" value="1" placeholder="天數" class="px-3 py-2 text-sm rounded-lg bg-white/80 border border-stone-300 focus:outline-none focus:ring-2 focus:ring-amber-200">
        <input type="number" name="max_capacity" value="20" required placeholder="最大容量" class="px-3 py-2 text-sm rounded-lg bg-white/80 border border-stone-300 focus:outline-none focus:ring-2 focus:ring-amber-200">
        <input type="date" name="start_date" class="px-3 py-2 text-sm rounded-lg bg-white/80 border border-stone-300 focus:outline-none focus:ring-2 focus:ring-amber-200">
        <div class="md:col-span-3">
          <label for="tour-image" class="block text-sm mb-2">行程封面圖片（選填）</label>
          <input id="tour-image" type="file" accept="image/jpeg,image/png,image/webp" onchange="prepareTourImage(this)" aria-describedby="image-status">
          <p id="image-status" role="status" class="text-xs text-stone-500 mt-2">支援 JPG、PNG、WebP，最大 10 MB；將自動縮小為封面圖片。</p>
          <img id="image-preview" alt="行程封面預覽" hidden style="width:240px;max-width:100%;height:160px;object-fit:cover;border-radius:12px;margin-top:12px">
          <button type="button" onclick="clearTourImage()" class="text-xs mt-2 underline">移除圖片</button>
        </div>
        <div class="md:col-span-3 flex justify-end">
          <button type="submit" class="px-5 py-2 rounded-lg bg-stone-800 text-white text-sm hover:bg-stone-700 transition">確認上架行程</button>
        </div>
      </form>
    </div>

    <!-- 管理專區：訂單與會員總覽 (對應 doGet read_orders, read_members 與 update_order_status) -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="watercolor-card p-6">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-md font-semibold text-stone-800">📋 訂單總覽與狀態管理</h3>
          <button onclick="fetchOrders()" class="text-xs bg-stone-100 px-2.5 py-1 rounded border">重新整理訂單</button>
        </div>
        <div id="admin-orders-container" class="space-y-3 max-h-60 overflow-y-auto pr-1 text-xs">
          <p class="text-stone-400 italic">尚未載入訂單資料。</p>
        </div>
      </div>

      <div class="watercolor-card p-6">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-md font-semibold text-stone-800">👥 會員名冊總覽</h3>
          <button onclick="fetchMembers()" class="text-xs bg-stone-100 px-2.5 py-1 rounded border">重新整理會員</button>
        </div>
        <div id="admin-members-container" class="space-y-3 max-h-60 overflow-y-auto pr-1 text-xs">
          <p class="text-stone-400 italic">尚未載入會員資料。</p>
        </div>
      </div>
    </div>
  </section>

  <!-- 主內容區塊 -->
  <main class="max-w-7xl mx-auto px-6 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- 左側行程網格 -->
    <div class="lg:col-span-2 space-y-6">
      <div class="flex justify-between items-center">
        <h2 class="text-2xl font-semibold text-stone-800">精選寫生行旅</h2>
        <button onclick="fetchTours()" class="text-xs text-stone-500 bg-white/60 px-3 py-1.5 rounded-full border border-stone-200 transition">重新整理畫布</button>
      </div>
      <div id="tour-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="watercolor-card p-6 text-center py-12 text-stone-400">正在調配水彩色彩與讀取行程...</div>
      </div>
    </div>

    <!-- 右側手札與訂單報名 (對應 order 路由) -->
    <div class="lg:col-span-1">
      <div class="sticky top-24 watercolor-card p-6">
        <div class="flex justify-between items-center border-b border-stone-200 pb-4 mb-4">
          <h3 class="text-lg font-semibold text-stone-800">📖 心願旅行手札</h3>
          <span id="cart-count" class="text-xs bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full">0 項行程</span>
        </div>
        <div id="cart-container" class="space-y-4 mb-6">
          <div class="text-center py-8 text-stone-400 text-xs italic">手札尚無行程，請從左側挑選。</div>
        </div>
        <form id="checkout-form" onsubmit="handleCheckout(event)" class="space-y-3 pt-3 border-t border-stone-200 hidden">
          <div>
            <label class="block text-xs text-stone-600 mb-1">訂購會員編號 (user_id)</label>
            <input type="text" id="order-user-id" required placeholder="請先完成會員註冊" class="w-full px-3 py-2 text-sm rounded-lg bg-stone-100 border border-stone-300" readonly>
          </div>
          <div>
            <label class="block text-xs text-stone-600 mb-1">旅客聯絡姓名</label>
            <input type="text" id="contact-name" required placeholder="例如：林曉涵" class="w-full px-3 py-2 text-sm rounded-lg bg-white/80 border border-stone-300">
          </div>
          <div>
            <label class="block text-xs text-stone-600 mb-1">旅客聯絡電話</label>
            <input type="tel" id="contact-phone" required placeholder="0912-345-678" class="w-full px-3 py-2 text-sm rounded-lg bg-white/80 border border-stone-300">
          </div>
          <div class="pt-2 flex justify-between text-sm font-semibold">
            <span>總計金額：</span>
            <span id="cart-total-amount" class="text-amber-700 text-lg">NT$ 0</span>
          </div>
          <button type="submit" class="w-full py-3 rounded-xl bg-stone-800 text-white text-sm hover:bg-stone-700 transition">確認報名並建立訂單</button>
        </form>
      </div>
    </div>
  </main>

  <!-- 會員註冊彈窗 (對應 register_member) -->
  <div id="member-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/30 backdrop-blur-sm hidden">
    <div class="watercolor-card bg-white p-8 max-w-sm w-full mx-4 shadow-2xl">
      <h3 class="text-lg font-semibold text-stone-800 mb-4">✨ 會員註冊 (register_member)</h3>
      <form onsubmit="handleRegisterMember(event)" class="space-y-3">
        <input type="text" id="reg-name" required placeholder="會員姓名" class="w-full px-3 py-2 text-sm rounded-lg border border-stone-300">
        <input type="email" id="reg-email" required placeholder="電子郵件 (Email)" class="w-full px-3 py-2 text-sm rounded-lg border border-stone-300">
        <select id="reg-role" class="w-full px-3 py-2 text-sm rounded-lg border border-stone-300">
          <option value="user">一般旅客 (user)</option>
          <option value="admin">管理員/嚮導 (admin)</option>
        </select>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeMemberModal()" class="px-4 py-2 text-xs text-stone-500">取消</button>
          <button type="submit" class="px-5 py-2 rounded-lg bg-stone-800 text-white text-xs">確認註冊</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 一般訊息彈窗 -->
  <div id="custom-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/30 backdrop-blur-sm hidden">
    <div class="watercolor-card bg-white p-8 max-w-sm w-full mx-4 text-center shadow-2xl">
      <div id="modal-icon" class="text-4xl mb-3">🌸</div>
      <h3 id="modal-title" class="text-lg font-semibold text-stone-800 mb-2">通知</h3>
      <p id="modal-message" class="text-xs text-stone-600 mb-6 leading-relaxed"></p>
      <button onclick="closeModal()" class="px-6 py-2 rounded-full bg-stone-800 text-white text-xs">確定</button>
    </div>
  </div>

  <footer class="mt-auto py-6 text-center text-xs text-stone-400 border-t border-stone-200/40">
    <p>雲端水色智慧旅遊系統 &copy; 2026</p>
  </footer>

  <script>
    // 請在此處填入您的 Google Apps Script 部署網址 (Web App URL)
    const API_URL = "https://script.google.com/macros/s/AKfycbwZRuCzKHR8s3q2Q1d4kLfYvVOT1KN74vEkX8lSaMwY-1tXjvbFHLqsD8d-XIhCaH_O/exec"; // 填入 https://script.google.com/macros/s/部署ID/exec

    async function requestApi(action, payload) {
      const urlText = API_URL.trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(urlText)) {
        throw new Error("尚未設定有效的 GAS 網址：請將 API_URL 改為部署後的 https://script.google.com/macros/s/部署ID/exec 網址。");
      }
      const url = new URL(urlText);
      const options = { redirect: "follow" };
      //判斷用來分辨這次的請求是 「寫入/更新資料」 還是 「讀取資料」：當 payload !== undefined 為真（有傳入資料）：代表這是一次寫入操作，程式碼會切換為 POST 模式，將資料包裝在 HTTP 請求的主體（Body）中發送。當 payload === undefined 為偽（沒傳入資料）：代表這是一次讀取操作，程式碼會走 else 進入 GET 模式，直接將 action 參數附加在網址（URL Query String）後方
      if (payload !== undefined) {
        options.method = "POST";
        options.headers = { "Content-Type": "text/plain;charset=utf-8" };
        options.body = JSON.stringify({ ...payload, action });
      } else {
        url.searchParams.set("action", action);
      }
      let response;
      try {
        response = await fetch(url.toString(), options);
      } catch (error) {
        throw new Error("無法連線至 GAS，請檢查網路、部署網址及存取權限。若是寫入操作，請先確認試算表是否已寫入再重試。");
      }
      if (!response.ok) {
        throw new Error(`API 回應 HTTP ${response.status}，請檢查 GAS 部署網址及存取權限。`);
      }
      let result;
      try {
        result = JSON.parse(await response.text());
      } catch (error) {
        throw new Error("API 未回傳 JSON，可能回傳登入頁或錯誤頁。請檢查 GAS 網頁應用程式部署及存取權限。");
      }
      if (!result || !["success", "error"].includes(result.status)) {
        throw new Error("API 回應格式不符，請確認網址對應 travel.js 部署。");
      }
      if (result.status === "error") throw new Error(result.message || "後端操作失敗");
      return result;
    }

    function showLoadError(id, error) {
      document.getElementById(id).textContent = error.message;
    }

    let toursData = [];
    let cartItem = null;
    let cartQuantity = 1;
    let isGuideMode = false;
    let loggedInUser = null; // 儲存已登入的會員資訊

    document.addEventListener("DOMContentLoaded", () => {
      fetchTours();
    });

    function toggleGuideMode() {
      isGuideMode = !isGuideMode;
      const panel = document.getElementById("guide-panel");
      const btn = document.getElementById("toggle-guide-mode");
      if (isGuideMode) {
        panel.classList.remove("hidden");
        btn.textContent = "退出嚮導後台";
        btn.classList.add("bg-amber-100");
        fetchOrders();
        fetchMembers();
      } else {
        panel.classList.add("hidden");
        btn.textContent = "🖌️ 切換為嚮導後台";
        btn.classList.remove("bg-amber-100");
      }
      renderTours();
    }

    // 1. 讀取行程 (action: read)
    async function fetchTours() {
      try {
        const result = await requestApi("read");
        if (result.status === "success") {
          toursData = result.data || [];
          renderTours();
        }
      } catch (error) {
        console.error("讀取行程錯誤:", error);
        showLoadError("tour-grid", error);
      }
    }

    // 2. 讀取訂單 (action: read_orders)
    async function fetchOrders() {
      try {
        const result = await requestApi("read_orders");
        const container = document.getElementById("admin-orders-container");
        if (result.status === "success" && result.data.length > 0) {
          container.innerHTML = result.data.map(ord => `
            <div class="p-3 bg-white/80 rounded-lg border border-stone-200 flex flex-col space-y-2">
              <div class="flex justify-between font-semibold">
                <span>${ord.id}</span>
                <span class="text-amber-700">NT$ ${ord.total_amount}</span>
              </div>
              <div class="text-stone-500">行程ID: ${ord.menu_id} | 數量: ${ord.quantity} | 聯絡人: ${ord.contact_name}</div>
              <div class="flex items-center justify-between pt-1 border-t">
                <span>狀態: <b class="text-indigo-600">${ord.status}</b></span>
                <div class="space-x-1">
                  <select id="status-sel-${ord.id}" class="text-xs border rounded px-1 py-0.5">
                    <option value="pending" ${ord.status==='pending'?'selected':''}>pending</option>
                    <option value="paid" ${ord.status==='paid'?'selected':''}>paid</option>
                    <option value="cancelled" ${ord.status==='cancelled'?'selected':''}>cancelled</option>
                  </select>
                  <button onclick="updateOrderStatus('${ord.id}')" class="bg-stone-800 text-white px-2 py-0.5 rounded text-[10px]">更新</button>
                </div>
              </div>
            </div>
          `).join('');
        } else {
          container.innerHTML = `<p class="text-stone-400 italic">目前無任何訂單資料。</p>`;
        }
      } catch (err) { console.error(err); showLoadError("admin-orders-container", err); }
    }

    // 3. 讀取會員 (action: read_members)
    async function fetchMembers() {
      try {
        const result = await requestApi("read_members");
        const container = document.getElementById("admin-members-container");
        if (result.status === "success" && result.data.length > 0) {
          container.innerHTML = result.data.map(m => `
            <div class="p-2 bg-white/80 rounded-lg border border-stone-200 flex justify-between items-center">
              <div>
                <p class="font-semibold">${m.name} <span class="text-stone-400 font-normal">(ID: ${m.id})</span></p>
                <p class="text-stone-500">${m.email}</p>
              </div>
              <span class="px-2 py-0.5 rounded bg-amber-50 text-amber-800 text-[10px] border">${m.role}</span>
            </div>
          `).join('');
        } else {
          container.innerHTML = `<p class="text-stone-400 italic">目前無任何會員資料。</p>`;
        }
      } catch (err) { console.error(err); showLoadError("admin-members-container", err); }
    }

    function renderTours() {
      const grid = document.getElementById("tour-grid");
      if (toursData.length === 0) {
        grid.innerHTML = `<div class="col-span-2 text-center py-12 text-stone-400 text-sm">目前無上架行程。</div>`;
        return;
      }
      grid.innerHTML = toursData.map(tour => `
        <div class="watercolor-card p-6 flex flex-col justify-between relative">
          ${isGuideMode ? `<button onclick="deleteTour('${tour.id}')" class="absolute top-4 right-4 w-7 h-7 bg-rose-50 rounded-full border border-rose-200 text-rose-600 flex items-center justify-center text-xs">🗑️</button>` : ''}
          <div>
            ${coverMarkup(tour.image_data)}
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs px-3 py-1 rounded-full bg-stone-100 text-stone-600">${tour.category || '行旅'}</span>
              <span class="text-xs text-stone-400">餘位: ${tour.max_capacity - tour.current_booked} / ${tour.max_capacity}</span>
            </div>
            <h3 class="text-lg font-semibold text-stone-800">${tour.title}</h3>
            <p class="text-xs text-stone-500 mt-1">出發日：${tour.start_date || '未定'}</p>
          </div>
          <div class="pt-4 mt-4 border-t border-stone-200/50 flex justify-between items-center">
            <span class="text-base font-semibold text-stone-800">NT$ ${Number(tour.price).toLocaleString()}</span>
            <button onclick="addToCart(toursData[${toursData.indexOf(tour)}])" class="px-4 py-2 rounded-xl text-xs bg-stone-800 text-white hover:bg-stone-700 transition">收入手札</button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(tour) {
      cartItem = tour;
      cartQuantity = 1;
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById("cart-container");
      const checkoutForm = document.getElementById("checkout-form");
      const countBadge = document.getElementById("cart-count");

      if (!cartItem) {
        countBadge.textContent = "0 項行程";
        container.innerHTML = `<div class="text-center py-8 text-stone-400 text-xs italic">手札尚無行程。</div>`;
        checkoutForm.classList.add("hidden");
        return;
      }
      countBadge.textContent = "1 項行程";
      checkoutForm.classList.remove("hidden");

      container.innerHTML = `
        <div class="p-3 bg-white/80 rounded-xl border border-stone-200 relative">
          <button onclick="cartItem=null; renderCart();" class="absolute top-2 right-2 text-stone-400 hover:text-rose-600 text-xs">✕</button>
          <h4 class="text-sm font-semibold text-stone-800">${cartItem.title}</h4>
          <p class="text-xs text-stone-500 mt-1">單價：NT$ ${cartItem.price}</p>
          <div class="flex items-center justify-between mt-2 text-xs">
            <span>購買數量：</span>
            <input type="number" min="1" value="${cartQuantity}" onchange="cartQuantity=Number(this.value); renderCart();" class="w-16 px-2 py-1 border rounded text-center">
          </div>
        </div>
      `;
      document.getElementById("cart-total-amount").textContent = `NT$ ${(cartItem.price * cartQuantity).toLocaleString()}`;
    }

    // 4. 註冊會員 (action: register_member)
    async function handleRegisterMember(event) {
      event.preventDefault();
      const payload = {
        action: "register_member",
        name: document.getElementById("reg-name").value,
        email: document.getElementById("reg-email").value,
        role: document.getElementById("reg-role").value
      };
      try {
        const result = await requestApi(payload.action, payload);
        if (result.status === "success") {
          loggedInUser = result.data;
          document.getElementById("current-user-info").textContent = `${loggedInUser.name} (ID:${loggedInUser.id})`;
          document.getElementById("user-badge").classList.remove("hidden");
          document.getElementById("user-badge").classList.add("flex");
          document.getElementById("order-user-id").value = loggedInUser.id;
          closeMemberModal();
          showModal("✨", "會員註冊成功", `歡迎加入，您的會員編號為：${loggedInUser.id}`);
          if (isGuideMode) fetchMembers();
        } else {
          showModal("⚠️", "註冊失敗", result.message);
        }
      } catch (err) { showModal("⚠️", "連線錯誤", err.message); }
    }

    let selectedTourImage = "";
    let imageProcessing = false;
    let imageRevision = 0;

    function clearTourImage() {
      imageRevision++;
      selectedTourImage = "";
      imageProcessing = false;
      document.getElementById("tour-image").value = "";
      const preview = document.getElementById("image-preview");
      preview.hidden = true;
      preview.removeAttribute("src");
      document.getElementById("image-status").textContent = "未選擇圖片（可不附圖上架）。";
    }

    async function prepareTourImage(input) {
      const file = input.files[0];
      clearTourImage();
      if (!file) return;
      const revision = imageRevision;
      imageProcessing = true;
      const status = document.getElementById("image-status");
      let objectUrl;
      try {
        if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) throw new Error("請選擇 JPG、PNG 或 WebP 圖片。");
        if (file.size > 10 * 1024 * 1024) throw new Error("圖片不可超過 10 MB。");
        status.textContent = "正在處理圖片，請稍候…";
        objectUrl = URL.createObjectURL(file);
        const img = new Image();
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = () => reject(new Error("無法讀取圖片，請換一張圖片。"));
          img.src = objectUrl;
        });
        if (revision !== imageRevision) return;
        const canvas = document.createElement("canvas");
        let encoded = "";
        for (const maxSide of [800, 640, 480, 320, 240]) {
          const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
          canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
          const context = canvas.getContext("2d");
          context.fillStyle = "#ffffff";
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.drawImage(img, 0, 0, canvas.width, canvas.height);
          for (const quality of [0.8, 0.65, 0.5, 0.35]) {
            encoded = canvas.toDataURL("image/jpeg", quality);
            if (encoded.length <= 45000) break;
          }
          if (encoded.length <= 45000) break;
        }
        if (!encoded.startsWith("data:image/jpeg;base64,") || encoded.length > 45000) throw new Error("圖片無法壓縮至儲存限制，請選擇較簡單的圖片。");
        selectedTourImage = encoded;
        const preview = document.getElementById("image-preview");
        preview.src = encoded;
        preview.hidden = false;
        status.textContent = `圖片已準備好（${canvas.width} × ${canvas.height}），確認上架時一併儲存。`;
      } catch (error) {
        if (revision === imageRevision) status.textContent = error.message;
      } finally {
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        if (revision === imageRevision) imageProcessing = false;
      }
    }

    function coverMarkup(value) {
      if (typeof value !== "string" || value.length > 45000 || !/^data:image\/jpeg;base64,[A-Za-z0-9+/]+={0,2}$/.test(value)) return "";
      return `<img src="${value}" alt="行程封面" loading="lazy" style="width:100%;height:180px;object-fit:cover;border-radius:12px;margin-bottom:16px" onerror="this.hidden=true">`;
    }

    // 5. 新增行程 (action: add_menu)
    async function handleAddTour(event) {
      event.preventDefault();
      if (imageProcessing) { showModal("⌛", "圖片處理中", "請等候圖片預覽完成再上架。"); return; }
      const button = event.target.querySelector('button[type="submit"]');
      if (button.disabled) return;
      const fd = new FormData(event.target);
      const payload = {
        action: "add_menu",
        title: fd.get("title"), category: fd.get("category"),
        price: Number(fd.get("price")), duration_days: Number(fd.get("duration_days")),
        max_capacity: Number(fd.get("max_capacity")), start_date: fd.get("start_date"), status: 1, image_data: selectedTourImage
      };
      button.disabled = true;
      button.textContent = "正在上架…";
      try {
        const result = await requestApi(payload.action, payload);
        if (result.status === "success") {
          if (payload.image_data && !result.data?.image_saved) {
            showModal("⚠️", "行程已新增，但圖片未儲存", "目前雲端後端尚未支援圖片。請更新 travel.js 並部署新版本；請勿重複上架同一行程。");
          } else {
            showModal("✨", "上架成功", "新行程已順利加入畫布與資料庫。");
          }
          event.target.reset();
          clearTourImage();
          fetchTours();
        } else { showModal("⚠️", "上架失敗", result.message); }
      } catch(err) { showModal("⚠️", "錯誤", err.message); }
      finally { button.disabled = false; button.textContent = "確認上架行程"; }
    }

    // 6. 刪除行程 (action: delete_menu)
    async function deleteTour(menu_id) {
      if (!confirm("確定要將此行程永遠刪除嗎？")) return;
      try {
        const result = await requestApi("delete_menu", { menu_id });
        if (result.status === "success") {
          showModal("🗑️", "刪除成功", result.message);
          fetchTours();
        } else { showModal("⚠️", "刪除失敗", result.message); }
      } catch(err) { showModal("⚠️", "錯誤", err.message); }
    }

    // 7. 訂單報名 (action: order)
    async function handleCheckout(event) {
      event.preventDefault();
      if (!cartItem) return;
      if (!loggedInUser) {
        showModal("⚠️", "請先註冊會員", "訂購前請先在右上角完成會員註冊以取得會員編號。");
        return;
      }

      const payload = {
        action: "order",
        user_id: loggedInUser.id,
        menu_id: cartItem.id,
        quantity: cartQuantity,
        contact_name: document.getElementById("contact-name").value,
        contact_phone: document.getElementById("contact-phone").value
      };

      try {
        const result = await requestApi(payload.action, payload);
        if (result.status === "success") {
          showModal("🌸", "行程報名成功", `訂單編號：${result.data.order_id}\n總金額：NT$ ${result.data.total_amount.toLocaleString()}`);
          cartItem = null;
          renderCart();
          fetchTours();
          if (isGuideMode) fetchOrders();
        } else {
          showModal("⚠️", "報名受阻", result.message);
        }
      } catch(err) { showModal("⚠️", "錯誤", err.message); }
    }

    // 8. 更新訂單狀態 (action: update_order_status)
    async function updateOrderStatus(order_id) {
      const newStatus = document.getElementById(`status-sel-${order_id}`).value;
      const payload = {
        action: "update_order_status",
        order_id: order_id,
        status: newStatus
      };
      try {
        const result = await requestApi(payload.action, payload);
        if (result.status === "success") {
          showModal("📋", "更新成功", result.message);
          fetchOrders();
        } else { showModal("⚠️", "更新失敗", result.message); }
      } catch(err) { showModal("⚠️", "錯誤", err.message); }
    }

    function openMemberModal() { document.getElementById("member-modal").classList.remove("hidden"); }
    function closeMemberModal() { document.getElementById("member-modal").classList.add("hidden"); }
    function showModal(icon, title, message) {
      document.getElementById("modal-icon").textContent = icon;
      document.getElementById("modal-title").textContent = title;
      document.getElementById("modal-message").textContent = message;
      document.getElementById("custom-modal").classList.remove("hidden");
    }
    function closeModal() { document.getElementById("custom-modal").classList.add("hidden"); }
  </script>
</body>
